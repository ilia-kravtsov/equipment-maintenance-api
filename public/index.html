<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Equipment Maintenance</title>

    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
<main class="container">
    <header class="page-header">
        <h1 class="page-title">Заявки на обслуживание</h1>
        <p class="page-subtitle">
            Управление заявками на обслуживание оборудования
        </p>
    </header>

    <section class="panel">
        <h2 class="panel-title">Фильтры</h2>

        <form id="filters-form" class="form form-filters">
            <label class="form-field">
                Статус
                <select id="status-filter" name="status">
                    <option value="">Все</option>
                    <option value="new">Новая</option>
                    <option value="in_progress">В работе</option>
                    <option value="done">Выполнена</option>
                    <option value="rejected">Отклонена</option>
                </select>
            </label>

            <label class="form-field">
                Приоритет
                <select id="priority-filter" name="priority">
                    <option value="">Все</option>
                    <option value="low">Низкий</option>
                    <option value="medium">Средний</option>
                    <option value="high">Высокий</option>
                    <option value="critical">Критический</option>
                </select>
            </label>

            <button class="button" type="submit">
                Применить
            </button>

            <button
                    id="reset-filters"
                    class="button"
                    type="button"
            >
                Сбросить
            </button>
        </form>
    </section>

    <section class="panel">
        <h2 class="panel-title">Список заявок</h2>

        <p
                id="requests-message"
                class="message"
                role="status"
        ></p>

        <div
                id="requests-list"
                class="requests-list"
        ></div>
    </section>

    <section class="panel">
        <h2 class="panel-title">Создать заявку</h2>

        <form id="create-request-form" class="form">
            <label class="form-field">
                API key
                <input
                        id="api-key"
                        name="apiKey"
                        type="password"
                        autocomplete="off"
                        required
                />
            </label>

            <label class="form-field">
                ID оборудования
                <input
                        id="equipment-id"
                        name="equipmentId"
                        type="text"
                        required
                />
            </label>

            <label class="form-field">
                Название
                <input
                        id="request-title"
                        name="title"
                        type="text"
                        minlength="5"
                        maxlength="120"
                        required
                />
            </label>

            <label class="form-field">
                Описание
                <textarea
                        id="request-description"
                        name="description"
                        maxlength="2000"
                ></textarea>
            </label>

            <label class="form-field">
                Приоритет
                <select
                        id="request-priority"
                        name="priority"
                        required
                >
                    <option value="low">Низкий</option>
                    <option value="medium" selected>Средний</option>
                    <option value="high">Высокий</option>
                    <option value="critical">Критический</option>
                </select>
            </label>

            <label class="form-field">
                Плановая дата
                <input
                        id="planned-at"
                        name="plannedAt"
                        type="datetime-local"
                />
            </label>

            <button
                    class="button button-primary"
                    type="submit"
            >
                Создать заявку
            </button>
        </form>

        <p
                id="create-message"
                class="message"
                role="status"
        ></p>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
