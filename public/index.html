<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipment Maintenance</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
<main class="container">
    <header>
        <h1>Заявки на обслуживание</h1>
        <p>Управление заявками на обслуживание оборудования</p>
    </header>

    <section>
        <h2>Фильтры</h2>

        <form id="filters-form">
            <label>
                Статус
                <select id="status-filter" name="status">
                    <option value="">Все</option>
                    <option value="new">Новая</option>
                    <option value="in_progress">В работе</option>
                    <option value="done">Выполнена</option>
                    <option value="rejected">Отклонена</option>
                </select>
            </label>

            <label>
                Приоритет
                <select id="priority-filter" name="priority">
                    <option value="">Все</option>
                    <option value="low">Низкий</option>
                    <option value="medium">Средний</option>
                    <option value="high">Высокий</option>
                    <option value="critical">Критический</option>
                </select>
            </label>

            <button type="submit">Применить</button>
            <button type="button" id="reset-filters">Сбросить</button>
        </form>
    </section>

    <section>
        <h2>Список заявок</h2>

        <p id="requests-message" role="status"></p>

        <div id="requests-list"></div>
    </section>

    <section>
        <h2>Создать заявку</h2>

        <form id="create-request-form">
            <label>
                API key
                <input
                        id="api-key"
                        name="apiKey"
                        type="password"
                        autocomplete="off"
                        required
                />
            </label>

            <label>
                ID оборудования
                <input
                        id="equipment-id"
                        name="equipmentId"
                        type="text"
                        required
                />
            </label>

            <label>
                Название
                <input
                        id="request-title"
                        name="title"
                        type="text"
                        minlength="5"
                        maxlength="120"
                        required
                />
            </label>

            <label>
                Описание
                <textarea
                        id="request-description"
                        name="description"
                        maxlength="2000"
                ></textarea>
            </label>

            <label>
                Приоритет
                <select id="request-priority" name="priority" required>
                    <option value="low">Низкий</option>
                    <option value="medium" selected>Средний</option>
                    <option value="high">Высокий</option>
                    <option value="critical">Критический</option>
                </select>
            </label>

            <label>
                Плановая дата
                <input
                        id="planned-at"
                        name="plannedAt"
                        type="datetime-local"
                />
            </label>

            <button type="submit">Создать заявку</button>
        </form>

        <p id="create-message" role="status"></p>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
