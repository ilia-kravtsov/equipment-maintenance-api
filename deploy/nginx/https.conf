log_format safe '$remote_addr $request_method $uri '
                '$status ${request_time}s';

upstream equipment_api {
    zone equipment_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:3000 resolve;
}

server {
    listen 443 ssl;
    server_name equipment-maintenance-api.online;

    ssl_certificate /etc/letsencrypt/live/equipment-maintenance-api.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/equipment-maintenance-api.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    server_tokens off;

    access_log /var/log/nginx/access.log safe;

    client_max_body_size 100k;
    client_body_timeout 10s;
    send_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location /api/health/ {
        proxy_pass http://equipment_api;
    }

    location /api/ {
        proxy_pass http://equipment_api;
    }

    location /api-docs {
        proxy_pass http://equipment_api;
    }

    location /metrics {
        return 404;
    }

    location / {
        proxy_pass http://equipment_api;
    }

    server {
        listen 80;
        server_name equipment-maintenance-api.online;
        server_tokens off;

        access_log /var/log/nginx/access.log safe;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 308 https://equipment-maintenance-api.online$request_uri;
        }
    }
}