apiVersion: 1

groups:
  - orgId: 1
    name: equipment-api
    folder: Equipment Maintenance
    interval: 30s

    rules:
      - uid: equipment-api-unavailable
        title: API metrics unavailable
        condition: B
        for: 1m
        noDataState: Alerting
        execErrState: Alerting

        labels:
          severity: critical
          service: equipment-maintenance-api

        annotations:
          summary: Prometheus cannot collect API metrics
          description: Check API container status and logs, then verify /api/health/ready.

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: up{job="equipment-api"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
                    params: []
                  query:
                    params: [B]