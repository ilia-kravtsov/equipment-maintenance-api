services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/equipment-maintenance/grafana.htpasswd:/etc/nginx/auth/grafana.htpasswd:ro

  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://equipment-maintenance-api.online/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"

    networks:
      - backend
      - frontend